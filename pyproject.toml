[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-classifier-agent"
version = "0.1.0"
description = "Local-first photo subject classification agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
vision = [
  "Pillow>=10.0",
  "torch>=2.2",
  "open-clip-torch>=2.24",
  "transformers==4.49.0",
  "accelerate>=0.34",
  "peft>=0.13",
  "safetensors>=0.4",
  "huggingface-hub==0.29.3",
  "requests>=2.32",
  "einops>=0.8",
]
dev = ["pytest>=8.0"]
subject-selector = ["lightgbm==4.6.0"]

[project.scripts]
photo-agent = "photo_classifier_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
